[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "financial-health-engine"
version = "0.1.0"
description = "Financial Health Assessment Engine for MSMEs"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",

    "pydantic>=2.11",
    "pydantic-settings>=2.10",

    "python-dotenv>=1.1",

    "numpy>=2.3",

    "pyyaml>=6.0",

    "structlog>=25.4",

    "python-json-logger>=3.3"
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]